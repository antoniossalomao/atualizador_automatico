name: Build C# EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar o projeto
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./pasta_saida

    - name: Disponibilizar o .exe para download
      uses: actions/upload-artifact@v4
      with:
        name: AtualizadorAutomatico-EXE
        path: ./pasta_saida/*.exe
