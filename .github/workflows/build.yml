name: Build C# EXE

on:
  push:
    branches: [ "main" ]

jobs:
  # Portao de qualidade: roda ANTES do build/publish, e o job de publicacao depende
  # dele. Ate 2026-09, este workflow compilava e publicava a release "latest" a cada
  # push na main sem rodar UM teste sequer -- um agente quebrado ia direto pro link
  # que os clientes baixam. Este job existe pra fechar exatamente esse buraco.
  #
  # Roda so o subconjunto marcado como NAO dependente de Firebird (6 dos 39 testes).
  # O runner do GitHub nao tem Firebird 2.5 instalado, e os outros 33 abrem conexao
  # com um servidor real -- eles sao responsabilidade de quem desenvolve, antes de
  # abrir o PR (ver CONTRIBUTING.md). Nao e' cobertura completa; e' o maior gate
  # confiavel possivel sem tornar a publicacao refem de instalar um banco legado
  # dentro do CI.
  #
  # Para elevar isso no futuro: instalar o Firebird 2.5 aqui (o instalador oficial
  # aceita modo silencioso) e trocar o filtro por "dotnet test" puro. Foi deixado de
  # fora de proposito -- a publicacao hoje FUNCIONA, e trocar um gate confiavel por
  # um passo de instalacao nao verificado arriscaria quebrar o canal de entrega.
  testes:
    runs-on: windows-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v7

    - name: Configurar o .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    # "-warnaserror": o projeto compila com 0 warnings hoje, e a intencao e' que
    # continue assim. Warning que ninguem ve vira warning que ninguem conserta.
    # O .editorconfig promove tres regras de analisador a aviso (CA2016, CA5350/
    # CA5351 e CA1869), entao elas viram erro aqui -- ver CONTRIBUTING.md.
    - name: Compilar a solução (agente + testes) sem warnings
      run: dotnet build AtualizadorERP.sln -c Release -warnaserror

    - name: Testes que não dependem de Firebird
      run: dotnet test AtualizadorERP.sln -c Release --no-build --filter "Requer!=Firebird" --logger "console;verbosity=normal"

  build:
    needs: testes
    runs-on: windows-latest
    # O GITHUB_TOKEN default e' read-only em muitos repositorios -- sem isso, o passo
    # "Publicar a release" abaixo (que cria/atualiza a release "latest" e sobe o instalador)
    # falha com 403, mesmo o job inteiro rodando verde ate ali.
    permissions:
      contents: write

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v7

    - name: Configurar o .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    # "AtualizadorERP.csproj", nao a solucao: desde que o .sln passou a existir (ver
    # historico), "dotnet publish" sem projeto explicito resolve pra ele e tenta publicar
    # TODOS os projetos da solucao com -p:PublishSingleFile=true, inclusive o
    # AtualizadorERP.Tests -- que nao tem apphost e falha o publish com NETSDK1098
    # ("Applications published to a single-file are required to use the application host").
    - name: Compilar o projeto
      run: dotnet publish AtualizadorERP.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./Atualizador

    # O ".csproj" ja declara "atualizador.ini.example" com CopyToOutputDirectory, e isso
    # funciona numa publicacao unica e limpa (exatamente o que este workflow faz, a cada run,
    # a partir de um checkout novo). Mas reproduzido ao vivo: publicar duas vezes seguidas na
    # MESMA pasta, sem limpar antes, faz o arquivo sumir sozinho na segunda vez (a limpeza
    # incremental do MSBuild trata como "saida obsoleta"). Isso nao deveria acontecer aqui
    # (cada run e' um checkout limpo, uma publicacao so), mas copiar explicitamente custa nada
    # e tira essa dependencia de um comportamento incremental do MSBuild que ja se mostrou
    # fragil, do mesmo jeito que o 7za.exe abaixo ja e' copiado explicitamente em vez de contar
    # com magica do build.
    - name: Garantir o atualizador.ini.example no pacote
      shell: pwsh
      run: Copy-Item atualizador.ini.example -Destination "./Atualizador/atualizador.ini.example" -Force

    # O agente exige o 7za.exe ao lado do executavel: ExtractionService lanca
    # excecao se nao achar, e o ciclo de atualizacao aborta. Como o 7za.exe e'
    # binario de terceiro (fica fora do repositorio, ver .gitignore), sem este
    # passo o artefato compilava mas nao funcionava em cliente nenhum.
    #
    # A versao esta fixada de proposito: assim o pacote gerado hoje e o gerado
    # daqui a um ano sao identicos. Quando quiser subir de versao, troque o
    # numero aqui (o site publica em https://www.7-zip.org/download.html).
    - name: Incluir o 7za.exe no pacote
      shell: pwsh
      run: |
        $url = "https://www.7-zip.org/a/7z2602-extra.7z"
        Invoke-WebRequest -Uri $url -OutFile "7z-extra.7z"
        # O proprio runner do Windows ja tem o 7-Zip instalado, entao da para
        # descompactar o pacote que contem o 7za.exe.
        7z x "7z-extra.7z" -o7z-extra -y
        $origem = Get-ChildItem -Path "7z-extra" -Recurse -Filter "7za.exe" |
                  Where-Object { $_.FullName -notmatch "x64|arm64" } |
                  Select-Object -First 1
        if (-not $origem) { throw "7za.exe nao encontrado dentro do pacote baixado." }
        Copy-Item $origem.FullName -Destination "./Atualizador/7za.exe"
        Write-Host "7za.exe incluido a partir de $($origem.FullName)"

    - name: Conferir o conteúdo do pacote
      shell: pwsh
      run: |
        # Falha cedo e com mensagem clara se algo essencial nao estiver la,
        # em vez de publicar um artefato incompleto com o build verde.
        foreach ($obrigatorio in @("AtualizadorERP.exe", "7za.exe", "atualizador.ini.example")) {
          if (-not (Test-Path "./Atualizador/$obrigatorio")) {
            throw "Faltando no pacote: $obrigatorio"
          }
        }
        Get-ChildItem ./Atualizador | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

    # "./Atualizador" (a pasta inteira), nao "./Atualizador/*" (o conteudo dela):
    # quem instala precisa arrastar UMA pasta pra dentro da pasta do cliente (ver
    # "Onde o agente mora" no README), nao espalhar .exe/.dll/7za.exe soltos ali.
    # Passar a pasta sem "/*" faz o 7z preservar "Atualizador\" como a entrada de
    # topo do arquivo -- quem descompacta na raiz da pasta do cliente ja fica com
    # "Bredas\Atualizador\..." certinho, em vez dos arquivos soltos em "Bredas\".
    - name: Compactar o pacote em .7z
      shell: pwsh
      run: 7z a -t7z -mx=9 -m0=lzma2 AtualizadorAutomatico.7z ./Atualizador

    # Vira um instalador de verdade (.exe), igual ao pacote do B_Vendas: joga na pasta
    # do cliente, executa, aparece a pasta "Atualizador\" do lado -- sem precisar
    # descompactar nada na mao. Tecnica padrao do 7-Zip: concatenar em binario o modulo
    # SFX (7z.sfx, que ja vem instalado no runner junto com o 7-Zip completo -- nao e' o
    # 7za.exe "extra" baixado acima, que e' so o CLI standalone sem os modulos SFX) +
    # um config.txt de texto + o .7z com os dados. O resultado e' um .exe unico que roda
    # o extrator embutido do 7-Zip.
    - name: Gerar o config.txt do instalador
      shell: pwsh
      run: |
        $sfxModule = "C:\Program Files\7-Zip\7z.sfx"
        if (-not (Test-Path $sfxModule)) {
          throw "7z.sfx nao encontrado em '$sfxModule' -- o runner do GitHub deveria vir com o 7-Zip completo instalado (nao so o 7za.exe standalone). Se a imagem do runner mudou, ajuste o caminho aqui."
        }

        # GUIMode=1 + GUIFlags/OverwriteMode abaixo: barra de progresso simples, sem
        # perguntar pasta de destino (extrai sempre ao lado de onde o .exe for
        # executado) e sobrescrevendo sem perguntar -- o mesmo comportamento de
        # rodar duas vezes uma atualizacao por cima da anterior.
        #
        # Array de linhas, nao here-string: um here-string PowerShell exige o
        # delimitador de fechamento ("'@") na coluna zero da linha, o que colide com a
        # indentacao que o YAML exige dentro de um bloco "run: |".
        $linhasConfig = @(
          ';!@Install@!UTF-8!',
          'Title="Atualizador ERP"',
          'BeginPrompt="Instalar o Atualizador ERP nesta pasta?"',
          'ExtractTitle="Atualizador ERP - instalando"',
          'ExtractDialogText="Extraindo arquivos..."',
          'GUIFlags="8+32+64+256+4096"',
          'GUIMode="1"',
          'OverwriteMode="2"',
          ';!@InstallEnd@!'
        )
        Set-Content -Path config.txt -Value $linhasConfig -Encoding utf8NoBOM

    - name: Montar o instalador (.exe autoextraível)
      shell: cmd
      run: copy /b "C:\Program Files\7-Zip\7z.sfx" + config.txt + AtualizadorAutomatico.7z InstalarAtualizadorERP.exe

    - name: Conferir o instalador gerado
      shell: pwsh
      run: |
        # copy /b em binario nao falha alto se um dos pedacos nao existir -- confere de
        # verdade que o resultado e' maior que a soma dos dois primeiros pedacos (ou
        # seja, que o .7z de verdade entrou na conta, nao so o cabecalho do SFX).
        if (-not (Test-Path "InstalarAtualizadorERP.exe")) { throw "InstalarAtualizadorERP.exe nao foi gerado." }
        $tamanhoInstalador = (Get-Item "InstalarAtualizadorERP.exe").Length
        $tamanho7z = (Get-Item "AtualizadorAutomatico.7z").Length
        if ($tamanhoInstalador -le $tamanho7z) {
          throw "InstalarAtualizadorERP.exe ($tamanhoInstalador bytes) nao ficou maior que o AtualizadorAutomatico.7z ($tamanho7z bytes) -- o modulo SFX/config provavelmente nao entrou na concatenacao."
        }
        Write-Host "InstalarAtualizadorERP.exe gerado com $([math]::Round($tamanhoInstalador/1MB,1)) MB."

    # Troca actions/upload-artifact por uma Release: artefato do Actions SEMPRE vem
    # embrulhado num .zip extra ao baixar (arquivo dentro de arquivo, sem como desligar),
    # mas um asset de Release e' servido cru -- baixa o .exe e pronto, sem descompactar
    # nada antes de chegar no instalador. Tag fixa "latest", sempre sobrescrita: um link
    # estavel (.../releases/latest/download/InstalarAtualizadorERP.exe) que sempre aponta
    # pro build mais recente da main, sem acumular uma release por push.
    - name: Publicar a release "latest" com o instalador
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload latest InstalarAtualizadorERP.exe --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create latest InstalarAtualizadorERP.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Atualizador ERP (build mais recente da main)" \
            --notes "Publicado automaticamente a cada push na main. Baixe e execute InstalarAtualizadorERP.exe dentro da pasta do cliente -- ele extrai a pasta Atualizador\\ ao lado."
        fi
